<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidatos - WorkSite</title>
  <link rel="stylesheet" href="css/estadisticas.css">
</head>
<body>

<header>
  <div class="logo">WorkSite</div>
  <nav>
    <a href="inicio 2.html" class="nav-link">Inicio</a>
    <div class="menu-item" id="menuEstadisticas">
      <a href="estadisticas.html" class="nav-link">📊 Estadísticas</a>
    </div>
    <div class="menu-item">
      <a href="#" class="nav-link">
        <div class="avatar" id="avatarInicial"></div>
        <span class="arrow">▾</span>
      </a>
      <div class="submenu">
        <a href="perfil.html"><span>👤</span> Mi perfil</a>
        <a href="configuracion.html"><span>⚙️</span> Configuración</a>
        <div class="divider-nav"></div>
        <a id="botonCerrarSesion" class="danger"><span>🚪</span> Cerrar sesión</a>
      </div>
    </div>
  </nav>
</header>

<div class="hero-banner">
  <div class="hero-overlay">
    <h1>🙋 Candidatos</h1>
    <p>Listado de candidatos registrados</p>
  </div>
</div>

<main class="container">

  <a href="estadisticas.html" class="est-btn-ver" style="display:inline-block; margin-bottom:20px;">← Volver a Estadísticas</a>

  <div class="est-tabla-card">
    <div class="est-tabla-header">
      <h2 class="est-chart-title">Candidatos</h2>
      <input type="text" id="buscarCandidato" class="est-buscador" placeholder="Buscar candidato...">
    </div>
    <div class="est-tabla-wrapper">
      <table class="est-tabla" id="tablaCandidatos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Cargo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cuerpoTablaCandidatos">
          <!-- Filas generadas dinámicamente -->
        </tbody>
      </table>
      <p class="est-tabla-vacia" id="vacioCandidatos" style="display:none;">No hay candidatos registrados.</p>
    </div>
  </div>

</main>

<footer>
  © 2026 WorkSite | Todos los derechos reservados
</footer>

<script src="js/auth-guard.js"></script>
<script>
    requireAuth(["ADMIN"]);
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/core.js"></script>
<script>
  $(document).ready(function () {
    cargarCandidatos();

    document.getElementById('buscarCandidato').addEventListener('input', function (e) {
      var filtro = e.target.value.toLowerCase();
      document.querySelectorAll('#cuerpoTablaCandidatos tr').forEach(function (fila) {
        fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
      });
    });
  });

  function cargarCandidatos() {
    callApi(API_BASE_URL + "/api/admin/candidatos", "GET", null,
      function (response) {
        console.log("Respuesta candidatos:", response);

        var datos = Array.isArray(response) ? response: response.data;
        renderCandidatos(datos);
      },
      function (error) {
        console.error("Error al cargar candidatos:", error);
      }
    );
  }

  function renderCandidatos(datos) {
    var cuerpo = document.getElementById('cuerpoTablaCandidatos');
    cuerpo.innerHTML = '';
    document.getElementById('vacioCandidatos').style.display = datos.length ? 'none' : 'block';

    datos.forEach(function (c) {
      cuerpo.insertAdjacentHTML('beforeend', `
        <tr>
          <td>${c.nombreCompleto}</td>
          <td>${c.correoElectronico}</td>
          <td>${c.cargo ?? '-'}</td>
          <td><a href="perfil-candidato-detalle.html?id=${c.id}" class="est-btn-ver">Ver perfil</a></td>
        </tr>`);
    });
  }
</script>

</body>
</html>
