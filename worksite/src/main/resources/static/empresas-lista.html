<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresas - WorkSite</title>
  <link rel="stylesheet" href="css/estadisticas.css">
</head>
<body>

<header>
  <div class="logo">WorkSite</div>
  <nav>
    <a href="inicio 2.html" class="nav-link">Inicio</a>
    <div class="menu-item" id="menuEstadisticas">
      <a href="estadisticas.html" class="nav-link">📊 Estadísticas</a>
    </div>
    <div class="menu-item">
      <a href="#" class="nav-link">
        <div class="avatar" id="avatarInicial"></div>
        <span class="arrow">▾</span>
      </a>
      <div class="submenu">
        <a href="perfil.html"><span>👤</span> Mi perfil</a>
        <a href="configuracion.html"><span>⚙️</span> Configuración</a>
        <div class="divider-nav"></div>
        <a id="botonCerrarSesion" class="danger"><span>🚪</span> Cerrar sesión</a>
      </div>
    </div>
  </nav>
</header>

<div class="hero-banner">
  <div class="hero-overlay">
    <h1>🏢 Empresas</h1>
    <p>Listado de empresas registradas</p>
  </div>
</div>

<main class="container">

  <a href="estadisticas.html" class="est-btn-ver" style="display:inline-block; margin-bottom:20px;">← Volver a Estadísticas</a>

  <div class="est-tabla-card">
    <div class="est-tabla-header">
      <h2 class="est-chart-title">Empresas</h2>
      <input type="text" id="buscarEmpresa" class="est-buscador" placeholder="Buscar empresa...">
    </div>
    <div class="est-tabla-wrapper">
      <table class="est-tabla" id="tablaEmpresas">
        <thead>
          <tr>
            <th>Razón social</th>
            <th>Correo</th>
            <th>Ofertas publicadas</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cuerpoTablaEmpresas">
          <!-- Filas generadas dinámicamente -->
        </tbody>
      </table>
      <p class="est-tabla-vacia" id="vacioEmpresas" style="display:none;">No hay empresas registradas.</p>
    </div>
  </div>

</main>

<footer>
  © 2026 WorkSite | Todos los derechos reservados
</footer>

<script src="js/auth-guard.js"></script>
<script>
    requireAuth(["ADMIN"]);
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/core.js"></script>
<script>
  $(document).ready(function () {
    cargarEmpresas();

    document.getElementById('buscarEmpresa').addEventListener('input', function (e) {
      var filtro = e.target.value.toLowerCase();
      document.querySelectorAll('#cuerpoTablaEmpresas tr').forEach(function (fila) {
        fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
      });
    });
  });

  function cargarEmpresas() {
    callApi(API_BASE_URL + "/api/admin/empresas", "GET", null,
      function (response) {
        console.log("RESPUESTA EMPRESAS:", response);

      var cuerpo =document.getElementById('cuerpoTablaEmpresas');
      cuerpo.innerHTML = '';

      document.getElementById('vacioEmpresas').style.display = 
      response.length ? 'none' : 'block';

      response.forEach(function(e) {
        cuerpo.insertAdjacentHTML('beforeend', `
          <tr>
            <td>${e.nombre}</td>
            <td>${e.correo}</td>
            <td>
              <a href="perfil-empresa-detalle.html?id=${e.id}" class="est-btn-ver">
                Ver perfil
              </a>
            </td>
          </tr>
        `);
      });
    },
      
      function (error) {
        console.error("Error al cargar empresas:", error);
      }
    );
  }

  function renderEmpresas(datos) {
    var cuerpo = document.getElementById('cuerpoTablaEmpresas');
    cuerpo.innerHTML = '';
    document.getElementById('vacioEmpresas').style.display = datos.length ? 'none' : 'block';

    datos.forEach(function (e) {
      cuerpo.insertAdjacentHTML('beforeend', `
        <tr>
          <td>${e.nombre}</td>
          <td>${e.correo}</td>
          <td>${e.ofertasPublicadas}</td>
          <td><a href="perfil-empresa-detalle.html?id=${e.id}" class="est-btn-ver">Ver perfil</a></td>
        </tr>`);
    });
  }
</script>

</body>
</html>
